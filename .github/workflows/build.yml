name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -B -q clean compile

      - name: Package
        run: mvn -B -q package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: campus-ms-jar
          path: target/campus-ms.jar
          retention-days: 7
